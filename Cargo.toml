[workspace]
members = [
    "cli",
    "jito_protos",
    "searcher_client",
]
resolver = "2"

[workspace.dependencies]
# Internal crates
jito-protos = { path = "jito_protos" }
jito-searcher-client = { path = "searcher_client" }

# agave-repo crates are released in lockstep and cross-pin with `=`; solana-perf's
# max is 4.0.0, so the whole agave set is pinned to =4.0.0.
agave-transaction-view = "=4.0.0"
solana-perf = { version = "=4.0.0", features = ["dev-context-only-utils"] }
solana-svm-transaction = "=4.0.0"
solana-packet = "4.1.0"
solana-program = "4.0.0"
solana-client = "4.0.0"

# External crates
bincode = "1.3.3"
bytes = "1.4.0"
clap = { version = "4", features = ["derive", "env"] }
env_logger = "0.10"
futures-util = "0.3.28"
log = "0.4.17"
prost = "~0.14.0"
prost-types = "~0.14.0"
solana-bincode = "3.1.0"
solana-borsh = "3.0.2"

solana-commitment-config = "3.1.1"
solana-metrics = "4.0.0"
solana-nonce = "3.1.0"

solana-rpc-client-api = "4.0.0"
solana-sdk = "4.0.1"
solana-system-interface = { version = "3.1.0", features = ["bincode"] }
solana-tpu-client-next = "4.0.0"
solana-transaction-status = "4.0.0"
solana-transaction-status-client-types = "4.0.0"
thiserror = "1.0.40"
tokio = "1"
tonic = "~0.14.2"
tonic-health = "~0.14.0"
tonic-prost = "~0.14.0"
tonic-prost-build = "~0.14.0"
